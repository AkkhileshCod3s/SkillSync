<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 56" width="200" height="56" role="img" aria-label="Explore Profiles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Explore Profiles</title><style>
@keyframes pb{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-2px)}}.pb{animation:pb 1s steps(1) infinite}
@keyframes eye{0%,92%{transform:scaleY(1)}94%,97%{transform:scaleY(.1)}99%,100%{transform:scaleY(1)}}.eye{transform-box:fill-box;transform-origin:50% 50%;animation:eye 5s steps(1) infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.fl{animation:fl 5s ease-in-out infinite}
@keyframes hl{0%,5%{transform:scaleX(0)}25%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}.hl{transform-box:fill-box;transform-origin:0% 50%;animation:hl 8s ease-in-out infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes wv{0%,49%{transform:translateX(0)}50%,100%{transform:translateX(1px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e1d6b6"/></pattern></defs>
<rect width="200" height="56" rx="20" fill="#f7f0dc"/><rect width="200" height="56" rx="20" fill="url(#dots)"/>

<rect x="3" y="3" width="194" height="50" rx="25" fill="#f7f0dc" stroke="#14110f" stroke-width="1.8"/><text x="100.0" y="35" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14110f">Explore Profiles</text></svg>