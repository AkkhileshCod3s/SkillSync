@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes wy0{0.00%{opacity:1}33.32%{opacity:1}33.33%{opacity:0}100.00%{opacity:0}}.wy0{animation:wy0 9s linear infinite;opacity:0}@keyframes wy1{0.00%{opacity:0}33.32%{opacity:0}33.33%{opacity:1}66.66%{opacity:1}66.67%{opacity:0}100.00%{opacity:0}}.wy1{animation:wy1 9s linear infinite;opacity:0}@keyframes wy2{0.00%{opacity:0}66.66%{opacity:0}66.67%{opacity:1}100.00%{opacity:1}}.wy2{animation:wy2 9s linear infinite;opacity:0}</style>
